services:
  - type: web
    name: pcard-auditor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: GEMINI_API_KEY
        sync: false          # set this in the Render dashboard, not in this file
      - key: PYTHON_VERSION
        value: "3.11.9"
